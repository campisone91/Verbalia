name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt

      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: python -m ruff check .

      - name: Run Mypy type checker
        run: python -m mypy config.py bootstrap.py main.py modules

      - name: Compile Python bytecode
        run: python -m compileall -q config.py bootstrap.py main.py modules tests

      - name: Run automated offline test suite
        run: python -m pytest -m "not hardware" --cov=modules --cov-report=term-missing
